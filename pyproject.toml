[build-system]
requires = ["setuptools>=65.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jose-humanoid"
version = "0.1.0"
description = "JOSE: reconstructing privileged state from joint history for Unitree G1 motion control (Isaac Lab)"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: POSIX :: Linux",
]

[tool.setuptools]
packages = [
  "jose", "jose.agents", "jose.distillation", "jose.estimator",
  "jose.motions", "jose.tools",
  "jose.ppo_walk", "jose.ppo_walk.agents", "jose.ppo_walk.mdp",
  "jose.ppo_walk.utils",
]

[tool.setuptools.package-dir]
jose = "."
"jose.agents" = "agents"
"jose.distillation" = "distillation"
"jose.estimator" = "estimator"
"jose.motions" = "motions"
"jose.tools" = "tools"
"jose.ppo_walk" = "ppo_walk"
"jose.ppo_walk.agents" = "ppo_walk/agents"
"jose.ppo_walk.mdp" = "ppo_walk/mdp"
"jose.ppo_walk.utils" = "ppo_walk/utils"

[tool.setuptools.package-data]
jose = [
  "agents/*.yaml",
  "motions/*.npz",
  "usd/**/*",
]
